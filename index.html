<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Lyfe</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="alternate" type="application/json" href="lyfe-ai.json" title="Lyfe AI integration metadata" />
  <link rel="alternate" type="text/plain" href="llms.txt" title="Lyfe LLM instructions" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-container" class="app-container">
    <header class="header">
      <h1>Lyfe</h1>
      <div class="header-actions">
        <div class="user-selector">
          <label for="user-select">User</label>
          <select id="user-select"></select>
        </div>
        <button type="button" id="stats-btn" class="header-icon-btn" aria-label="View stats" title="Stats">Stats</button>
      </div>
    </header>

    <nav id="nav-bar">
      <button data-type="repeating" class="active">Repeating</button>
      <button data-type="contact">Keep in Touch</button>
      <button data-type="todos">Todos</button>
      <button data-type="birthdays">Occasions</button>
      <button data-type="calendar">Calendar</button>
    </nav>

    <div class="container">
      <div id="columns-container" class="columns">
        <div class="column" id="repeating-column"><div class="column-heading-row"><h2>Repeating Tasks</h2><button type="button" class="add-task-btn" data-add-type="repeating">+ Add</button></div><div id="repeating-list" class="task-list"></div></div>
        <div class="column" id="contacts-column"><div class="column-heading-row"><h2>Keep in Touch</h2><button type="button" class="add-task-btn" data-add-type="contact">+ Add</button></div><div id="contacts-list" class="task-list"></div></div>
        <div class="column" id="todos-column"><div class="column-heading-row"><h2>One-off Todos</h2><button type="button" class="add-task-btn" data-add-type="todos">+ Add</button></div><div id="todos-list" class="task-list"></div></div>
        <div class="column" id="birthdays-column"><div class="column-heading-row"><h2>Birthdays/Occasions</h2><button type="button" class="add-task-btn" data-add-type="birthdays">+ Add</button></div><div id="birthdays-list" class="task-list"></div></div>
      </div>

      <div id="calendar-view" style="display: none;">
        <div class="calendar-controls"><button id="prev-month">Previous</button><span id="current-month-label"></span><button id="next-month">Next</button></div>
        <div class="calendar-filters">
          <label class="calendar-filter-label calendar-repeating"><input type="checkbox" class="calendar-filter" value="repeating" checked> Repeating</label>
          <label class="calendar-filter-label calendar-contact"><input type="checkbox" class="calendar-filter" value="contact" checked> Keep in Touch</label>
          <label class="calendar-filter-label calendar-todo"><input type="checkbox" class="calendar-filter" value="todo" checked> Todo</label>
          <label class="calendar-filter-label calendar-birthday"><input type="checkbox" class="calendar-filter" value="birthday" checked> Occasion</label>
        </div>
        <div id="calendar-grid"></div>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-heading-row"><h2 id="add-modal-title">Add Task</h2><button type="button" id="add-modal-close" class="modal-close-btn" aria-label="Close">×</button></div>

      <form id="repeating-form" class="task-form add-modal-form" data-add-form="repeating">
        <label for="r-task-name">Task</label><input type="text" id="r-task-name" placeholder="Task Name" required>
        <label for="r-frequency">Frequency</label><input type="number" id="r-frequency" placeholder="Frequency (days)" min="1" required>
        <label for="r-area">Area</label><select id="r-area"></select>
        <label for="r-priority">Priority</label><select id="r-priority"></select>
        <label for="r-effort">Estimated effort</label><select id="r-effort"></select>
        <label for="r-owner">Owner</label><select id="r-owner"></select>
        <button type="submit">Add Task</button>
      </form>

      <form id="contacts-form" class="task-form add-modal-form" data-add-form="contact">
        <label for="c-contact-name">Person</label><input type="text" id="c-contact-name" placeholder="Contact Name" required>
        <label for="c-frequency">Frequency</label><input type="number" id="c-frequency" placeholder="Frequency (days)" min="1" required>
        <label for="c-area">Area</label><select id="c-area"></select>
        <label for="c-owner">Owner</label><select id="c-owner"></select>
        <button type="submit">Add Contact Task</button>
      </form>

      <form id="todos-form" class="task-form add-modal-form" data-add-form="todos">
        <label for="t-task-name">Task</label><input type="text" id="t-task-name" placeholder="Task Name" required>
        <label for="t-due-date">Due date</label><input type="date" id="t-due-date" required>
        <label for="t-area">Area</label><select id="t-area"></select>
        <label for="t-priority">Priority</label><select id="t-priority"></select>
        <label for="t-effort">Estimated effort</label><select id="t-effort"></select>
        <label for="t-owner">Owner</label><select id="t-owner"></select>
        <button type="submit">Add Todo</button>
      </form>

      <form id="birthdays-form" class="task-form add-modal-form" data-add-form="birthdays">
        <label for="b-task-name">Occasion</label><input type="text" id="b-task-name" placeholder="Occasion Name" required>
        <label for="b-date">Date</label><input type="date" id="b-date" required>
        <label for="b-area">Area</label><select id="b-area"></select>
        <label for="b-owner">Owner</label><select id="b-owner"></select>
        <button type="submit">Add Occasion</button>
      </form>
    </div>
  </div>

  <div id="stats-modal" class="modal" style="display: none;"><div class="modal-content stats-modal-content"><div class="modal-heading-row"><h2>Stats</h2><button type="button" id="stats-modal-close" class="modal-close-btn" aria-label="Close">×</button></div><div id="scoreboard"><div class="cell">Stats load only when you open this screen.</div></div></div></div>
  <div id="edit-modal" class="modal" style="display: none;"><div class="modal-content"><h2 id="edit-modal-title">Edit Task</h2><form id="edit-form"><div id="edit-fields"></div><button type="submit">Save</button><button type="button" id="edit-cancel-btn">Cancel</button></form></div></div>

  <script type="module" src="auth-gate.js"></script>
  <script type="module" src="script.js"></script>
  <script type="module" src="pwa.js"></script>
  <script src="ui.js"></script>
</body>
</html>
